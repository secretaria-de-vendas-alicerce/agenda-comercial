<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agenda Comercial · Alicerce</title>
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#f4f4f5">
  <meta name="description" content="Agenda Comercial da Alicerce — entre com a sua conta Google.">
  <meta name="robots" content="noindex">
  <!--
    WRAPPER DA AGENDA COMERCIAL — e por que ele REDIRECIONA em vez de embutir
    ------------------------------------------------------------------------
    Os wrappers dos outros apps da Alicerce (#9, #11, #13, #21) carregam a /exec dentro de um
    <iframe>, e funcionam porque aqueles web apps executam como o DONO: a identidade de quem usa
    vem do login proprio do app (usuario + senha), nao da conta Google.

    A Agenda e o contrario. O projeto A executa como QUEM ACESSA — e o Google Agenda que ele le e
    o da PESSOA. Dentro de um iframe o login do Google nao acontece (F0, D3), entao um wrapper de
    iframe aqui daria tela branca. E por isso que o card #22 do Hub esta `via: 'exec'`.

    O que este arquivo resolve e o OUTRO problema, o mesmo que fez o wrapper dos demais existir:
    a /exec crua passa pelo roteador /u/N/ do Google. Quem esta com duas contas logadas (a pessoal
    e a da equipe, que e o caso de todo gerente daqui) abre na conta ERRADA, e o app responde "seu
    e-mail ainda nao foi convidado" — ou o Google mostra "Nao foi possivel abrir o arquivo".

    A saida: mandar a pessoa pelo SELETOR DE CONTA do Google, e, quando o convite souber de quem e
    o link, ja com a conta certa escolhida.

      .../agenda-comercial/                -> seletor de conta, a pessoa escolhe
      .../agenda-comercial/?e=<e-mail>     -> seletor com aquela conta escolhida (o link do convite)

    A /exec abaixo e a do deployment AKfycbxCmbK8…WjGc do projeto A. Republicar com
    `create-deployment -i <mesmo id>` MANTEM este endereco; criar outro deployment o mata
    (Regra 30). Se um dia ele mudar, muda aqui e em `app/Config.gs` (LINK_PUBLICO aponta o
    caminho de volta), e o `tests/wrapper.test.js` cobra os dois.
  -->
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9; --card: #ffffff; --ink: #14181f; --muted: #5b6472;
      --accent: #0369a1; --accent-ink: #ffffff; --line: #e3e7ec;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #10141a; --card: #171d25; --ink: #e9edf3; --muted: #99a3b2; --accent: #38bdf8; --accent-ink: #06121c; --line: #253040; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: grid; place-items: center; padding: 24px calc(16px + env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom));
    }
    main { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 28px 24px; max-width: 26rem; width: 100%; text-align: center; }
    .selo { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
    .selo.ico { background: none; } .selo img { display: block; } /* icone proprio (ORD-ICONES-001 §4.1): a placa ja vem no desenho */
    h1 { font-size: 20px; margin: 0 0 6px; }
    p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
    a.btn {
      display: block; padding: 14px 18px; min-height: 48px; border-radius: 12px;
      background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 600;
    }
    .nota { margin: 16px 0 0; font-size: 12.5px; }
    code { background: rgba(127, 140, 160, .18); padding: 1px 5px; border-radius: 5px; font-size: 12px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <div class="selo ico" aria-hidden="true">
      <picture><source media="(prefers-color-scheme: dark)" srcset="agenda-hub-escuro@2x.png">
      <img src="agenda-hub-claro@2x.png" width="56" height="56" alt="" onerror="var s=this.closest('.selo');s.classList.remove('ico');s.innerHTML=&quot;<svg width='28' height='28' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'> <rect x='3' y='4' width='18' height='17' rx='2'/><path d='M8 2v4M16 2v4M3 10h18'/><path d='M8 14h3v3H8z'/> </svg>&quot;"></picture>
    </div>
    <h1>Agenda Comercial</h1>
    <p id="sub">Abrindo com a sua conta Google…</p>
    <a class="btn" id="entrar" href="#">Entrar na Agenda</a>
    <p class="nota" id="nota">Se o Google abrir na conta errada, volte aqui e escolha a conta certa.</p>
  </main>
  <script>
    (function () {
      'use strict';
      var EXEC = 'https://script.google.com/macros/s/AKfycbxCmbK8LAwXv0fduDX_GX5oKlUOtt_Edj4ET33fcxbs7R_JZ0H9UP5amlYJ-b2WjGc/exec';

      /** Só e-mail com cara de e-mail entra no link: o `e` da URL vem de fora. */
      function emailDaUrl() {
        var m = /[?&]e=([^&]+)/.exec(window.location.search || '');
        var e = m ? decodeURIComponent(m[1]).trim() : '';
        return /^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(e) ? e : '';
      }

      function destino(email) {
        return 'https://accounts.google.com/AccountChooser?'
          + (email ? 'Email=' + encodeURIComponent(email) + '&' : '')
          + 'continue=' + encodeURIComponent(EXEC);
      }

      var email = emailDaUrl();
      var url = destino(email);
      var a = document.getElementById('entrar');
      a.href = url;
      if (email) {
        document.getElementById('sub').textContent = 'Abrindo com a conta ' + email + '…';
        document.getElementById('nota').textContent = 'O convite é para esta conta. Se o Google pedir para entrar, use ela.';
      }
      // o clique do botão é o caminho garantido; o automático é só a comodidade
      window.setTimeout(function () { window.location.replace(url); }, 700);
    })();
  </script>
  <noscript>
    <p style="text-align:center">Ative o JavaScript, ou
      <a href="https://script.google.com/macros/s/AKfycbxCmbK8LAwXv0fduDX_GX5oKlUOtt_Edj4ET33fcxbs7R_JZ0H9UP5amlYJ-b2WjGc/exec">abra a agenda direto</a>.</p>
  </noscript>
</body>
</html>
